name: Build TTT mini APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No submodules any more. The reader engine left with the reader, and with it the class of
      # failure where a forgotten checkout flag produced an empty module directory and an error
      # that pointed nowhere near the cause.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx native libs
        run: bash tools/fetch-sherpa-onnx.sh

      # One permanent key, kept as an encrypted repository secret. Every build is then signed
      # identically, so a new version installs straight over the old one and Android never asks
      # anyone to uninstall anything. This is a different key from the full app's on purpose:
      # different app, different id, different key, and neither can ever overwrite the other.
      - name: Restore the signing key
        env:
          KS: ${{ secrets.TTT_LIGHT_KEYSTORE }}
          KS_PW: ${{ secrets.TTT_LIGHT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "No keystore secret found, this build would not be upgradable in place."
            exit 1
          fi
          echo "$KS" | base64 -d > tttlight.jks
          printf 'storeFile=tttlight.jks\nstorePassword=%s\nkeyAlias=tttlight\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > keystore.properties
          keytool -list -keystore tttlight.jks -storepass "$KS_PW" | grep -i 'SHA-256' || true

      - name: Build release APK
        # The version code must both match the release number shown in About and never go backwards,
        # or Android refuses the install as a downgrade. The fixed offset satisfies both: the code
        # stays ahead of every version already out there, and About subtracts the same offset so it
        # still prints the number the release is named after. The offset is permanent and must never
        # be lowered. It is carried over from the parent app deliberately, so the two apps' version
        # codes are read the same way by anyone looking at either.
        run: ./gradlew :app:assembleRelease -x lintVitalRelease --no-daemon -PprojectVersionCode=$((1000 + ${{ github.run_number }}))

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          # No ampersand in the file name. It is legal in a URL only when escaped, and a download
          # link that needs escaping is a link that breaks when it is pasted into a chat. The full
          # app's name had one and it had to be spelled 'ttt-lll' for exactly this reason.
          cp "$APK" ttt-mini-build-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" ttt-mini-build-${{ github.run_number }}.apk --title "TTT mini build ${{ github.run_number }}" --notes "TTT mini, Talk to Type, by Mantra Productions. Voice dictation into any text field. Installs beside TTT&LLL, not over it."

      # The two newest releases stay, everything older goes. One was too few: a link handed over
      # is dead the moment the next push publishes, and a one line change to a document is enough
      # to do that. Two means the link in somebody's hand still works while the next build lands.
      # Still bounded, so an old APK never sits there long enough to be mistaken for the current one.
      # Runs only after the publish step succeeds, so a failed build never deletes a good release.
      - name: Keep the two newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --yes --cleanup-tag || true
            echo "removed $tag"
          done
