# PINNED BY COMMIT, NEVER BY TAG.
#
# A tag is mutable: whoever owns the action can move v4 to point at anything, and this workflow runs
# with a token that can push to every repository in the account. In the GhostAction compromise of
# early 2025, repositories pinned to a moving tag pulled a modified action automatically and their CI
# secrets were exfiltrated — no compromise of this account required, only of somebody else's.
#
# Every SHA below was resolved from the tag named in the comment beside it on 23.8.2026, and annotated
# tags were dereferenced to the commit they point at rather than to the tag object. To update one:
# read the action's release notes, resolve the new tag to a SHA yourself, and change both the SHA and
# the comment in one commit — so the comment can never quietly disagree with what actually runs.
#
# Found by G1 of the delivery gate. It was the one blocking finding of the nine.

name: Build TTT mini APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No submodules any more. The reader engine left with the reader, and with it the class of
      # failure where a forgotten checkout flag produced an empty module directory and an error
      # that pointed nowhere near the cause.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Fetch sherpa-onnx native libs
        run: bash tools/fetch-sherpa-onnx.sh

      # One permanent key, kept as an encrypted repository secret. Every build is then signed
      # identically, so a new version installs straight over the old one and Android never asks
      # anyone to uninstall anything. This is a different key from the full app's on purpose:
      # different app, different id, different key, and neither can ever overwrite the other.
      - name: Restore the signing key
        env:
          KS: ${{ secrets.TTT_LIGHT_KEYSTORE }}
          KS_PW: ${{ secrets.TTT_LIGHT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "No keystore secret found, this build would not be upgradable in place."
            exit 1
          fi
          echo "$KS" | base64 -d > tttlight.jks
          printf 'storeFile=tttlight.jks\nstorePassword=%s\nkeyAlias=tttlight\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > keystore.properties
          keytool -list -keystore tttlight.jks -storepass "$KS_PW" | grep -i 'SHA-256' || true

      # ---------------------------------------------------------------------------------------
      # THE DELIVERY GATE, the part of it that is boring and constant.
      #
      # MANTRA_MANIFEST/modules/delivery-gate.md §13: G1, G2 and G3 belong in CI on every build,
      # failing the workflow rather than commenting on it, because "everything a person has to
      # remember will eventually not be remembered".
      #
      # Each step prints WHAT IT EXAMINED, not only what it found. A zero is a failure of the check
      # until proven otherwise — this project has already had a check report zero findings for a
      # twelve-entry enum because the indentation differed.
      # ---------------------------------------------------------------------------------------
      - name: "Gate G3 — verify.py and every Test 1 suite"
        run: |
          set -euo pipefail
          python3 scripts/verify.py
          fail=0
          for f in scripts/test_*.py; do
            echo "--- $f"
            python3 "$f" | tail -1 || fail=1
          done
          [ "$fail" = 0 ]

      - name: "Gate G5 — every unbounded loop, counted"
        run: |
          set -euo pipefail
          n=$(grep -rn --include=*.kt -F "while (true)" app/src lib | wc -l)
          echo "while(true) loops in the tree: $n"
          # Not a threshold, a record. The number moving is the signal; §7 asks for the count of
          # loops examined rather than only the count of problems.

      - name: Build release APK
        # The version code must both match the release number shown in About and never go backwards,
        # or Android refuses the install as a downgrade. The fixed offset satisfies both: the code
        # stays ahead of every version already out there, and About subtracts the same offset so it
        # still prints the number the release is named after. The offset is permanent and must never
        # be lowered. It is carried over from the parent app deliberately, so the two apps' version
        # codes are read the same way by anyone looking at either.
        run: ./gradlew :app:assembleRelease -x lintVitalRelease --no-daemon -PprojectVersionCode=$((1000 + ${{ github.run_number }}))

      # G2, on the ARTEFACT rather than the diff. A key committed months ago and removed last week
      # is absent from today's diff and present in every build made from that history.
      # G3, the half this project has never run.
      #
      # `-x lintVitalRelease` on the build line above switches Android Lint OFF for the release
      # build, and has since before the gate existed. The gate says Lint should be fatal on release.
      # **It is not turned on blind.** delivery-gate.md §5.2 is explicit that a check producing noise
      # gets fixed, narrowed or deleted in the session it produced the noise, and that a check which
      # cries wolf is worse than no check — so the first step is to find out how loud it is.
      #
      # continue-on-error: this step MEASURES. Once the count is known and the real findings are
      # cleared, drop the flag and let it block. Until then it is a number in the log, not a gate,
      # and this comment is the record of that being a decision rather than an oversight.
      - name: "Gate G3 — Android Lint (measuring, not yet blocking)"
        continue-on-error: true
        run: |
          ./gradlew :app:lintRelease --no-daemon || true
          f=$(find app/build/reports -name "lint-results*.xml" | head -1)
          if [ -n "$f" ]; then
            echo "lint report: $f"
            echo "errors:   $(grep -c 'severity="Error"' "$f" || true)"
            echo "warnings: $(grep -c 'severity="Warning"' "$f" || true)"
          else
            echo "no lint report produced"
          fi

      - name: "Gate G2 — scan the built APK for keys"
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "scanning: $apk ($(stat -c%s "$apk") bytes)"
          # `|| true` and it is load-bearing. grep exits 1 when it matches nothing, and with
          # `set -o pipefail` that fails the pipeline — so the first run of this gate FAILED THE
          # BUILD BECAUSE THE ARTEFACT WAS CLEAN. A check that goes red on success is worse than no
          # check: it teaches you that red means nothing.
          #
          # Caught on the very first run, which is the argument for §14's rule — make every check
          # fail on purpose once — turned inside out: this one was made to pass on purpose, and
          # could not.
          hits=$(strings -a "$apk" | grep -acE '(gsk_|AIza|ghp_|github_pat_|sk-ant-|xox[baprs]-)[A-Za-z0-9_-]{20,}' || true)
          hits=${hits:-0}
          echo "key-shaped strings found: $hits"
          if [ "$hits" -ne 0 ]; then
            echo "A key shape is present in the artefact. Not printing it. Stopping."
            exit 1
          fi

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          # No ampersand in the file name. It is legal in a URL only when escaped, and a download
          # link that needs escaping is a link that breaks when it is pasted into a chat. The full
          # app's name had one and it had to be spelled 'ttt-lll' for exactly this reason.
          cp "$APK" ttt-mini-build-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" ttt-mini-build-${{ github.run_number }}.apk --title "TTT mini build ${{ github.run_number }}" --notes "TTT mini, Talk to Type, by Mantra Productions. Voice dictation into any text field. Installs beside TTT&LLL, not over it."

      # The two newest releases stay, everything older goes. One was too few: a link handed over
      # is dead the moment the next push publishes, and a one line change to a document is enough
      # to do that. Two means the link in somebody's hand still works while the next build lands.
      # Still bounded, so an old APK never sits there long enough to be mistaken for the current one.
      # Runs only after the publish step succeeds, so a failed build never deletes a good release.
      - name: Keep the two newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --yes --cleanup-tag || true
            echo "removed $tag"
          done
